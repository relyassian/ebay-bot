# All money values in USD. Every rule in CLAUDE.md that has a number lives here.
dry_run: false               # the GitHub repo variable LIVE=true is the real on/off switch (see .github/workflows)

profit:
  floor: 100                  # never list/keep a size below this net
  target: 250                 # Tier A
  ebay_fee_rate: 0.136        # measured from a real $974 order
  promoted_rate: 0.0          # set when Promoted Listings are on
  inad_buffer_rate: 0.01      # "not as described" safety buffer
  sales_tax_rate: 0.06625     # NJ — items ship to eBay's NJ authenticator; only charged on taxable items:
  taxable_items: [356084785661]        # NJ exempts clothing & footwear (shoes, belts, ties); jewelry (cufflinks) is taxed
  taxable_categories: [accessory, jewelry]
  default_shipping: 20        # source shipping + fees if unknown
  store_shipping:             # measured at real checkout (Oct 5): StockX total = ask × 1.0595 + $14.95; GOAT = price + $14.95
    StockX: 14.95             # (StockX's ~6% fee is already in the cost rows; GOAT charges no fee; no NJ tax on shoes)
    GOAT: 14.95
  overseas_duty_rate: 0.10
  reship_cost: 20             # when a source can't keep the eVTN on line 2

listing:
  quantity_per_size: 1        # never more than 1 per size
  handling_days_min: 3
  returns: none
  best_offer_min_net: 400     # Best Offer only on single items netting >= this at list price (never on multi-size)
  auto_publish: true          # Rafael, Oct 5: list new products without asking if they clear the rules, have a catalog photo + verified style code, and aren't already listed
  template_item_id: 355429340181   # copy business policies + location from this listing

ads:
  rate: 0.08                  # Promoted Listings ad rate on every shoe listing (Rafael, Oct 2); prices raised once to cover it

exclude:                      # Rafael, Oct 4: nothing connected to idol worship. Only brands HE confirmed; ask him before adding any.
  brands: [Dior, Christian Dior, Hermes, Hermès, Christian Louboutin, Louboutin, Versace, Nike,
           Saint Laurent, Yves Saint Laurent, YSL, Valentino, Valentino Garavani]
  words: [Medusa, Buddha, cross, crucifix, saint, angel, angels]   # religious/mythological imagery (confirmed Oct 4)

pricing:
  decay: true                 # unsold 7 days at the same price → −3% (pre-approved), never below the $100 floor
  decay_after_days: 7
  decay_step: 0.03

risk:
  min_sources_per_size: 2     # anti-cancellation rule
  max_open_purchase_exposure: 5000
  max_cancellations_90d: 2

alerts:
  channel: telegram           # telegram | whatsapp

sync:
  max_source_age_hours: 36    # older source data counts as unknown
  auto_raise_pct: 0.15        # Rafael, Oct 5: raises up to +15% happen automatically; bigger ones wouldn't sell → size stays off sale
  allow_single_source: true   # Rafael, Oct 1: list/relist with just 1 store in stock; he accepts the cancellation risk
  ignore_items: [358573823614]  # AirPods Max — Rafael's own item
  single_source_items: [356084785661]  # Ferragamo cufflinks: only Cettire stocks them; Rafael OK'd (Sept 30)
  ignore_title_words: [AirPods]  # Rafael's personal electronics listings: never touched by the bot
