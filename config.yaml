# All money values in USD. Every rule in CLAUDE.md that has a number lives here.
dry_run: false               # the GitHub repo variable LIVE=true is the real on/off switch (see .github/workflows)

profit:
  floor: 100                  # never list/keep a size below this net
  target: 250                 # Tier A
  ebay_fee_rate: 0.136        # measured from a real $974 order
  promoted_rate: 0.0          # set when Promoted Listings are on
  inad_buffer_rate: 0.01      # "not as described" safety buffer
  sales_tax_rate: 0.06625     # NJ — items ship to eBay's NJ authenticator; only charged on taxable items:
  taxable_items: [356084785661]        # NJ exempts clothing & footwear (shoes, belts, ties); jewelry (cufflinks) is taxed
  taxable_categories: [accessory, jewelry]
  price_tiers:                # Rafael, Oct 5: over $1,500 → at least $300 profit, +$100 for every $500 more
    above: 1500
    min_net: 300
    step_price: 500
    step_net: 100
  brand_min_net:              # Rafael, Oct 5: Louis Vuitton only listed at ≥ $200 profit
    Louis Vuitton: 200
  default_shipping: 20        # source shipping + fees if unknown
  store_shipping:             # measured at real checkout (Oct 5): StockX total = ask × 1.0595 + $14.95; GOAT = price + $14.95
    StockX: 14.95             # (StockX's ~6% fee is already in the cost rows; GOAT charges no fee; no NJ tax on shoes)
    GOAT: 14.95
  overseas_duty_rate: 0.10
  reship_cost: 20             # when a source can't keep the eVTN on line 2

listing:
  quantity_per_size: 1        # never more than 1 per size
  handling_days_min: 3
  returns: none
  best_offer_min_net: 400     # Best Offer only on single items netting >= this at list price (never on multi-size)
  fuller_titles: true         # Rafael, Oct 5: fill titles toward 80 chars with true keywords (bot/titles.py)
  auto_publish: true          # Rafael, Oct 5: list new products without asking if they clear the rules, have a catalog photo + verified style code, and aren't already listed
  template_item_id: 355429340181   # copy business policies + location from this listing

ads:
  rate: 0.08                  # Promoted Listings ad rate on every shoe listing (Rafael, Oct 2); prices raised once to cover it
  top_viewed_n: 10            # Rafael, Oct 15: the 10 most-viewed listings (7-day views) may take a higher ad rate down to the $100 profit floor
  top_viewed_mult: 1.0
  boost_floor_net: 75         # Rafael, Oct 21: "just raise ad rates" - every listing takes the highest ad step that keeps net >= $75 at its current price
  boost_steps: [0.10, 0.12, 0.15, 0.18, 0.20]   # Rafael, Oct 7: higher rate per listing only while every live size keeps 1.5x the required profit (bot/ads.py tune)

exclude:                      # Rafael, Oct 4: nothing connected to idol worship. Only brands HE confirmed; ask him before adding any.
  brands: [Dior, Christian Dior, Hermes, Hermès, Christian Louboutin, Louboutin, Versace, Nike,
           Saint Laurent, Yves Saint Laurent, YSL, Valentino, Valentino Garavani]
  words: [Medusa, Buddha, cross, crucifix, saint, angel, angels]   # religious/mythological imagery (confirmed Oct 4)

markdown:                     # Rafael, Oct 5: eBay sale badges ("X% off", crossed-out price) — bot/markdown.py
  enabled: true
  days: 14
  floor_net: 75               # Rafael, Oct 21: sale badges may go down to $75 net
  steps: [25, 20, 15, 10, 5]      # biggest step where every live size still makes 1.5× the required profit
  tagline: Authentic designer shoes on sale

pricing:
  decay: true                 # unsold 7 days at the same price → −3% (pre-approved), never below the $100 floor
  decay_after_days: 7
  decay_step: 0.03
  decay_floor_mult: 1.5       # Rafael, Oct 5: drops never go below 1.5× the required profit ($150; LV $300); listing minimum stays $100
  market_floor_net: 75        # Rafael, Oct 21: "anything at 75 now" (was 80, Oct 20): "willing to bring it down to $80" - market matching (not new listings) may go to $80 net
  match_market: true          # Oct 11: ON while building the account with near-market sales; above-market products stay "uncompetitive" and get listed at planned prices once this is turned off. Rafael, Oct 7: "match market wherever you can" — drop to just under the eBay median of other new listings, never below the 1.5× floor (sync.market_drops)
  floor100_items:             # Rafael, Oct 8: TEST (review Oct 15) - market matching may go down to $100 profit on these
    - "820204075737"          # Gucci Rhyton Ivory: $100 floor $568 vs market $599 (fully matches)
    - "820207186615"          # Gucci MAC80 White/Blue: $698 vs market $649
    - "820205698211"          # Gucci Ace GG Embossed Black: $697 vs market $633
    - "820205221669"          # Gucci MAC80 Black/Off-White: $678 vs market $579
    - "820207186774"          # Gucci Run Black knit: $681 vs market $499
    # Rafael, Oct 19: "take it down to 100 but not less" - the 10 most-viewed listings (market matching and ad boosts may go to exactly the $100 net floor; net includes eBay fee, ad rate, 1% buffer, shipping, duty)
    - "355428079713"          # Gucci Ace Embroidered Bee
    - "820229263903"          # Gucci Horsebit Driver Loafer with Web
    - "820204075474"          # Gucci x adidas Gazelle Suede
    - "355429355271"          # Gucci Ace GG Crystal Canvas (black)
    - "355420832785"          # Ferragamo Moccasin with Gancini
    - "820223864929"          # Gucci Loafer with Interlocking G
    - "355429385763"          # Gucci Ace Sneaker with Web
    - "355429340181"          # Gucci Ace GG Crystal Canvas (green)
    - "820207186222"          # Gucci Ace GG Embossed White

risk:
  min_sources_per_size: 2     # anti-cancellation rule
  max_open_purchase_exposure: 5000
  max_cancellations_90d: 2

alerts:
  channel: telegram           # telegram | whatsapp

sync:
  max_source_age_hours: 36    # older source data counts as unknown
  auto_raise_pct: 0.15        # Rafael, Oct 5: raises up to +15% happen automatically; bigger ones wouldn't sell → size stays off sale
  allow_single_source: true   # Rafael, Oct 1: list/relist with just 1 store in stock; he accepts the cancellation risk
  ignore_items: [358573823614]  # AirPods Max — Rafael's own item
  single_source_items: [356084785661]  # Ferragamo cufflinks: only Cettire stocks them; Rafael OK'd (Sept 30)
  ignore_title_words: [AirPods]  # Rafael's personal electronics listings: never touched by the bot
