name: daily-sync
# Fixes every listing against data/source_prices.csv and applies approved plans.
# Runs after the 7:00am research task, and whenever source prices or approved plans are pushed.
on:
  schedule:
    - cron: "37 11 * * 0-5"   # 07:37 New York (daylight time); off the half-hour so GitHub does not skip it
  push:
    paths: ["data/source_prices.csv", "plans/approved/**", "data/candidates/**"]
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency: {group: ebay-write, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      EBAY_CLIENT_ID: ${{ vars.EBAY_CLIENT_ID || secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_RUNAME: ${{ vars.EBAY_RUNAME || secrets.EBAY_RUNAME }}
      EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Sync listings
        if: ${{ env.EBAY_REFRESH_TOKEN != '' }}
        run: python -m bot.cli sync ${{ vars.LIVE == 'true' && '--live' || '' }}
      - name: Sale alerts (backup for the always-on job)
        if: ${{ env.EBAY_REFRESH_TOKEN != '' }}
        run: |
          python -m bot.cli sales
      - name: New listing drafts
        if: ${{ env.EBAY_REFRESH_TOKEN != '' }}
        run: python -m bot.cli drafts
      - name: Save state
        run: |
          git config user.name "ebay-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A plans data || true
          git diff --cached --quiet || (git commit -m "bot: sync state" && git pull --rebase && git push)
      - name: Make sure the 30-minute sale-alert chain is running
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          active=$(gh run list -R "$GITHUB_REPOSITORY" -w sales.yml --json status -q '[.[]|select(.status!="completed")]|length')
          [ "${active:-0}" = "0" ] && gh workflow run sales.yml -R "$GITHUB_REPOSITORY" || echo "chain alive"
