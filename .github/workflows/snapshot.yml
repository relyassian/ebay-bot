name: snapshot
# Read-only: exports all active listings to data/snapshot.json (for rewriting legacy titles/descriptions).
on:
  push:
    paths: ["requests/snapshot"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      EBAY_CLIENT_ID: ${{ vars.EBAY_CLIENT_ID || secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_RUNAME: ${{ vars.EBAY_RUNAME || secrets.EBAY_RUNAME }}
      EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m bot.cli snapshot
      - run: |
          git config user.name "ebay-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/snapshot.json data/selling_limits.json
          git diff --cached --quiet || (git commit -m "bot: listings snapshot" && bash scripts/push_state.sh)
