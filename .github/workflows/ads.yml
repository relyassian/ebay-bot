name: ads-on
# Turns Promoted Listings on for every shoe listing and raises prices once to cover the fee (bot/ads.py).
on:
  push:
    paths: ["requests/ads"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: {group: ebay-write, cancel-in-progress: false}
jobs:
  ads:
    runs-on: ubuntu-latest
    env:
      EBAY_CLIENT_ID: ${{ vars.EBAY_CLIENT_ID || secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_RUNAME: ${{ vars.EBAY_RUNAME || secrets.EBAY_RUNAME }}
      EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python -m bot.cli ads-on ${{ vars.LIVE == 'true' && '--live' || '' }}
      - name: Save state
        if: ${{ always() }}
        run: |
          git config user.name "ebay-bot"; git config user.email "bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || (git commit -m "bot: ads state" && git pull --rebase && git push)
