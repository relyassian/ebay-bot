name: sale-alerts
# Also reads Rafael's Telegram replies (APPROVE/SKIP/PAUSE/RESUME) and lists approved drafts.
# New order → Telegram alert with what to buy, where, and the exact ship-to address (eVTN).
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the :00/:30 marks GitHub drops under load; fits free minutes
  workflow_dispatch: {}
  push:
    paths: ["requests/sales"]   # touch this file to (re)start the chain
permissions:
  contents: write
  actions: write   # lets the job start its own next run (GitHub's cron alone proved unreliable here)
concurrency: {group: ebay-sales, cancel-in-progress: false}
jobs:
  sales:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EBAY_CLIENT_ID: ${{ vars.EBAY_CLIENT_ID || secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_RUNAME: ${{ vars.EBAY_RUNAME || secrets.EBAY_RUNAME }}
      EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ env.EBAY_REFRESH_TOKEN != '' }}
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: ${{ env.EBAY_REFRESH_TOKEN != '' }}
        run: |
          pip install -r requirements.txt
          python -m bot.cli sales
          python -m bot.cli inbox ${{ vars.LIVE == 'true' && '--live' || '' }}
      - name: Save seen orders
        run: |
          git config user.name "ebay-bot"; git config user.email "bot@users.noreply.github.com"
          git add data 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "bot: sales/inbox state" && git pull --rebase && git push)
      - name: Start the next check in ~30 minutes (self-chaining; cron above is only a backup)
        if: ${{ always() }}
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          sleep 1500
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w sales.yml -s queued --json databaseId -q 'length')
          [ "${busy:-0}" = "0" ] && gh workflow run sales.yml -R "$GITHUB_REPOSITORY" || echo "next run already queued"
