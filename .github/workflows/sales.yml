name: sale-alerts
# Always-on loop: each run answers Telegram within seconds and checks sales every 10 min for ~25 min,
# then starts the next run. daily-sync restarts the chain if it ever stops; touch requests/sales to start it.
on:
  workflow_dispatch: {}
  push:
    paths: ["requests/sales"]   # touch this file to (re)start the chain
permissions:
  contents: write
  actions: write   # lets the job start its own next run (GitHub's cron alone proved unreliable here)
concurrency: {group: ebay-sales, cancel-in-progress: false}
jobs:
  sales:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EBAY_CLIENT_ID: ${{ vars.EBAY_CLIENT_ID || secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_RUNAME: ${{ vars.EBAY_RUNAME || secrets.EBAY_RUNAME }}
      EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ env.EBAY_REFRESH_TOKEN != '' }}
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Answer Telegram within seconds + check sales every 10 min, for ~25 min
        if: ${{ env.EBAY_REFRESH_TOKEN != '' }}
        run: |
          pip install -q -r requirements.txt
          git config user.name "ebay-bot"; git config user.email "bot@users.noreply.github.com"
          python -m bot.cli listen --minutes 25 ${{ vars.LIVE == 'true' && '--live' || '' }}
      - name: Start the next run right away (self-chaining)
        if: ${{ always() }}
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w sales.yml -s queued --json databaseId -q 'length')
          [ "${busy:-0}" = "0" ] && gh workflow run sales.yml -R "$GITHUB_REPOSITORY" || echo "next run already queued"
