name: dry-run
on:
  schedule:
    - cron: "0 11 * * 0-5"   # 07:00 New York in daylight time (11:00 UTC). Change to "0 12 * * 0-5" when clocks go back in November.
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_RUNAME: ${{ secrets.EBAY_RUNAME }}
      EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Read live listings (read-only)
        if: ${{ env.EBAY_REFRESH_TOKEN != '' }}
        run: python -m bot.cli show 355429340181
